name: Architecture check

on:
  pull_request:
  push:
    branches:
      - main
      - preprod

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'

      - name: Reject stale architecture paths
        run: |
          if grep -R -n -E 'client/src/main/resources/ui|/cmd/rabbitmq|store/postgres/usecase' \
            --exclude-dir=.git --exclude='architecture-check.yml' .; then
            echo "stale architecture path found"
            exit 1
          fi

      - name: Test HTTP service
        working-directory: services/http
        run: go test ./...

      - name: Test TCP service
        working-directory: services/tcp
        run: go test ./...

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate compose
        run: |
          cp services/http/.env.example services/http/.env
          cp services/tcp/.env.example services/tcp/.env
          cp apps/web/.env.example apps/web/.env
          docker compose config >/dev/null
