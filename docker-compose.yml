name: neosync

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: neosync
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    rabbitmq:
        image: rabbitmq:3-management
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        environment:
            REDIS_PASSWORD: red1spa55
        command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    web:
        build:
            context: apps/web
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file:
            - ./apps/web/.env
        ports:
            - '5173:5173'
        volumes:
            - ./apps/web:/app
            - web_node_modules:/app/node_modules
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    http:
        restart: always
        build:
            context: services/http
            dockerfile: Dockerfile
        env_file:
            - ./services/http/.env
        command: air
        ports:
            - '8080:8080'
        volumes:
            - ./services/http:/app
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    tcp:
        restart: always
        build:
            context: services/tcp
            dockerfile: Dockerfile
        env_file:
            - ./services/tcp/.env
        command: air
        ports:
            - '12346:12346'
        volumes:
            - ./services/tcp:/app
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:
    web_node_modules:
